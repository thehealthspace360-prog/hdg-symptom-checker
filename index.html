<!DOCTYPE html>
<html lang="en">
<head>

<title>Ask HDG | Health Decoded Guide</title>

<style>
*{box-sizing:border-box}
:root{--green:#1f5b4b;--gold:#d5a515;--bg:#f6f7f4;--ink:#222;--muted:#6d746f;--red:#b42318;--amber:#a56500}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:780px;margin:36px auto;padding:18px}
.checker{background:#fff;border-radius:18px;padding:28px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.header{background:var(--green);color:#fff;margin:-28px -28px 24px;padding:22px 28px;border-radius:18px 18px 0 0}
h1{margin:0 0 5px;font-size:26px}.sub{font-size:14px;opacity:.92}
.language{display:flex;gap:8px;margin-bottom:16px}
.lang-btn,.choice,.secondary{background:#fff;color:var(--green);border:1px solid var(--green);border-radius:20px;padding:9px 16px;cursor:pointer;font-size:14px}
.lang-btn.active,.choice:hover,.choice.selected{background:var(--green);color:#fff}
.status{font-size:12px;color:var(--muted);margin:0 0 14px}
.question{margin:0 0 10px;line-height:1.45}
textarea{width:100%;min-height:92px;border:1px solid #bbb;border-radius:10px;padding:14px;font-size:16px;resize:vertical}
.send{width:100%;margin-top:12px;border:0;border-radius:10px;padding:14px;background:var(--gold);font-size:16px;font-weight:bold;cursor:pointer}
.send:disabled{opacity:.55}
.card{margin-top:18px;padding:18px;background:#f3f5f1;border-radius:12px;line-height:1.55;border-left:5px solid var(--green)}
.card.urgent{background:#fff1f0;border-left-color:var(--red)}
.card.caution{background:#fff8e6;border-left-color:var(--amber)}
.choices{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}

.why-box{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.035);line-height:1.45}
.suggestion-wrap{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}
.suggestion-chip{
  border:1.5px solid var(--green);
  background:#fff;
  color:var(--green);
  border-radius:999px;
  padding:9px 14px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  line-height:1.25;
  text-align:left;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.suggestion-chip:hover,
.suggestion-chip:focus-visible{
  background:var(--green);
  color:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.10);
  outline:none;
}
.suggestion-chip:active{
  transform:translateY(1px);
}
.choice{border-radius:9px}
.summary-row{margin:7px 0}
.article{background:#fff;border:1px solid #ddd;border-radius:9px;padding:13px;margin-top:10px}
.article a{color:var(--green);font-weight:bold;text-decoration:none}.article a:hover{text-decoration:underline}
.muted{color:var(--muted);font-size:13px}.small{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.back-row{display:flex;justify-content:flex-start;margin:8px 0 4px}
.back-btn{background:transparent;color:var(--green);border:1px solid #b8c9c2;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:13px}
.back-btn:hover{background:#f3f8f5}
.reason-box{margin:12px 0;padding:11px 13px;border-radius:10px;background:#f5f7f5;line-height:1.45}
.uncertainty-box{margin:12px 0;padding:11px 13px;border-radius:10px;background:#fff8e6;border-left:4px solid var(--amber);line-height:1.45}
.learn-focus{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.learn-focus button{background:#fff;color:var(--green);border:1px solid var(--green);border-radius:999px;padding:8px 12px;cursor:pointer}
.related-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 14px;background:#fff;border:1px solid #d9e3de;border-radius:10px;color:var(--green);font-weight:700;cursor:pointer;text-align:left}
.related-toggle:hover{background:#f5f8f6}
.related-arrow{font-size:20px;line-height:1;transition:transform .22s ease}
.related-toggle.open .related-arrow{transform:rotate(180deg)}
.related-section{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .25s ease;padding:0 2px}
.related-section.open{max-height:900px;opacity:1;padding-top:8px}
.secondary{border-radius:9px}.hidden{display:none}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:bold;margin-bottom:8px}
.badge.red{background:#fee4e2;color:#912018}.badge.amber{background:#fff0c2;color:#7a4a00}.badge.green{background:#e4f2ec;color:#155544}
@media(max-width:600px){.wrap{margin:0;padding:0}.checker{border-radius:0;min-height:100vh}.header{border-radius:0}}

.hdg-footer{
  margin:14px 0 4px;
  padding-top:12px;
  border-top:1px solid #e6ece9;
  color:#6b756f;
  font-size:12px;
  line-height:1.45;
}
.hdg-footer strong{color:#46534d}
.hdg-footer .research-note{margin-top:5px;font-size:11.5px;color:#7a837e}
.hdg-footer a{color:var(--green);text-decoration:none}
.hdg-footer a:hover{text-decoration:underline}


/* ===== v57 mobile-first UX polish ===== */
.starter-label{
  margin:12px 0 7px;
  font-size:12px;
  font-weight:700;
  color:#66736d;
}
#starterSuggestions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:0 0 14px;
}

  font-weight:600;
  line-height:1.3;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

  content:"→";
  flex:0 0 auto;
  font-size:17px;
}
#starterSuggestions .suggestion-btn:hover,
#starterSuggestions .suggestion-btn:focus-visible{
  background:#edf6f2;
  outline:none;
}
#askBtn{min-height:48px}
#symptom{min-height:92px}
@media(max-width:600px){
  body{background:#fff}
  .wrap{margin:0;padding:0;width:100%;max-width:none}
  .checker{
    width:100%;
    max-width:none;
    min-height:100dvh;
    border:0;
    border-radius:0;
    box-shadow:none;
    padding-bottom:18px;

  .header{border-radius:0;padding:18px 18px 16px}
  .header h1{font-size:23px;line-height:1.15}
  .header .sub{font-size:12px;margin-top:4px}
  .language{padding-left:16px;padding-right:16px;margin-top:14px}
  #chat,#inputArea,#backRow,.hdg-footer{margin-left:16px;margin-right:16px}
  #inputArea{margin-top:10px}
  .question{font-size:17px;line-height:1.3;margin-bottom:8px}
  #symptom{font-size:16px;min-height:100px;padding:13px}
  #askBtn{width:100%;min-height:50px;font-size:16px}
  #starterSuggestions{grid-template-columns:1fr}
  #starterSuggestions .suggestion-btn{
    min-height:50px;
    font-size:14px;
    padding:11px 13px;
  }
  .hdg-footer{font-size:11.5px;line-height:1.4;margin-top:16px}
  .hdg-footer .research-note{font-size:11px}
  .choices{display:grid;grid-template-columns:1fr;gap:8px}
  .choice{width:100%;min-height:48px;text-align:left}
}


#indexStatus{display:none!important}

/* ===== v58 desktop starter-suggestion alignment ===== */
@media(min-width:601px){
  #starterSuggestions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    width:100%;
    margin:12px 0 14px;
    align-items:stretch;
  }
  #starterSuggestions .starter-label{
    grid-column:1 / -1;
    margin:0 0 -2px;

  #starterSuggestions .suggestion-btn{
    min-width:0;
    width:100%;
    height:100%;
    min-height:52px;
    margin:0;
    border-radius:12px;
    padding:10px 13px;
    justify-content:space-between;
    text-align:left;
    white-space:normal;
  }
}


.field-guide{
  color:#5f6d66;
  font-size:12px;
  font-weight:700;
  line-height:1.3;
}
.language-guide{

.input-guide{

@media(max-width:600px){

/* ===== v61 no top green banner ===== */
.checker{padding-top:12px}
@media(max-width:600px){

.language-guide{

  .language-guide{
    margin-left:0 !important;
    margin-right:0 !important;
    padding-left:16px;
    padding-right:16px;
  }
}

function norm(s){return String(s||"").toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu," ").replace(/\s+/g," ").trim()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function includesAny(text,arr){const n=norm(text);return arr.some(x=>n.includes(norm(x)))}

function detectFamily(text){
  const n=norm(normalizeEverydaySymptoms(text));
  let best={id:"general",score:0};
  FAMILY_RULES.forEach(f=>{
    let score=0;
    f.terms.forEach(t=>{if(n.includes(norm(t))) score+=norm(t).split(" ").length;});
    if(score>best.score) best={id:f.id,score};
  });
  return best.id;
}

function immediateDanger(text){
  return includesAny(text,IMMEDIATE_DANGER);
}

function answer(id){return data.targeted[id]||""}


function freeTextSafetyFacts(){
  const t=norm(normalizeEverydaySymptoms(data.other||""));
  return {
    chestAssoc: includesAny(t,["shortness of breath","breathless","sweating","sweaty","nausea","feeling sick","light headed","light-headed","dizzy"]),
    chestSpread: includesAny(t,["pain spreading to arm","pain spreading to arms","pain spreading to jaw","pain spreading to neck","pain spreading to back"]),
    chestPressure: includesAny(t,["chest pressure","chest tightness","tight chest","heavy chest","squeezing chest"]),
    breathCannotSpeak: includesAny(t,["cannot speak","can't speak","cant speak","not able to get words out","gasping"]),
    blueGrey: includesAny(t,["blue lips","grey lips","gray lips","blue skin","grey skin","gray skin"]),
    confusion: includesAny(t,["confusion","confused","sudden confusion","not making sense"]),
    neuroFast: includesAny(t,["face droop","slurred speech","one sided weakness","one-sided weakness","one sided numbness","one-sided numbness"]),
    neuroSudden: includesAny(t,["sudden severe headache","worst headache","thunderclap headache"]),
    suddenVisionLoss: includesAny(t,["sudden vision loss","suddenly blind","sudden blindness","sudden loss of sight","suddenly cannot see","suddenly can't see","suddenly cant see","suddenly unable to see","all of a sudden i can't see","all of a sudden i cannot see"]),
    suddenHearingLoss: includesAny(t,["sudden hearing loss","suddenly deaf","sudden deafness","suddenly cannot hear","suddenly can't hear","suddenly cant hear","suddenly unable to hear","all of a sudden i can't hear","all of a sudden i cannot hear"]),
    suddenWeakness: includesAny(t,["sudden weakness","suddenly weak","sudden numbness","suddenly numb"]),
    bleedHeavy: includesAny(t,["heavy bleeding","bleeding won't stop","bleeding wont stop","uncontrolled bleeding"]),
    bleedSource: includesAny(t,["vomiting blood","blood in vomit","coughing blood","black stool","a lot of blood in stool"]),
    fainting: includesAny(t,["fainting","fainted","passed out","blackout","collapsed"]),
    allergyAirway: includesAny(t,["swollen tongue","tongue swelling","swollen throat","throat swelling","swollen lips","lip swelling"]),
    allergyBreath: includesAny(t,["difficulty breathing","shortness of breath","wheezing","choking","gasping","trouble swallowing"]),
    seizureLong: includesAny(t,["seizure more than 5 minutes","seizure over 5 minutes","seizure lasting more than 5 minutes","seizure not stopping"]),
    stiffNeckFever: includesAny(t,["fever and stiff neck","fever with stiff neck","stiff neck and fever"]),
    severeAbd: includesAny(t,["severe abdominal pain","severe tummy pain","severe belly pain","severe pelvic pain"])

function safetyDisposition(){
  const ctx=norm(normalizeEverydaySymptoms([data.main,data.other].filter(Boolean).join(" ")));
  const ft=freeTextSafetyFacts();

  if(immediateDanger(ctx)) return "emergency";

  // Reassess free-text additional symptoms even if the user previously
  // answered "No" or "Not sure" to a targeted question.
  // The latest positive symptom information must not be ignored.
  if(ft.breathCannotSpeak || ft.blueGrey || ft.neuroFast || ft.seizureLong) return "emergency";
  if(ft.suddenVisionLoss || ft.suddenWeakness) return "emergency";
  if(ft.suddenHearingLoss) return "urgent_stop";
  if(ft.bleedHeavy) return "emergency";

  if(data.family==="chest"){
    if(ft.chestSpread) return "emergency";
    if(ft.chestPressure && ft.chestAssoc) return "emergency";
    if(ft.chestAssoc) return "urgent";
  }

  if(data.family==="breathing"){
    if(ft.confusion) return "emergency";
    if(ft.chestPressure) return "urgent";
  }

  if(data.family==="neuro"){
    if(ft.neuroSudden) return "emergency";
    if(ft.stiffNeckFever) return "urgent";
  }

  if(data.family==="bleeding"){
    if(ft.bleedSource && ft.fainting) return "emergency";
    if(ft.bleedSource || ft.fainting) return "urgent";
  }

  if(data.family==="abdominal"){
    if(ft.severeAbd && ft.fainting) return "emergency";
    if(ft.severeAbd) return "urgent";
  }

  if(data.family==="allergy"){
    if(ft.allergyAirway && ft.allergyBreath) return "emergency";
    if(ft.allergyBreath) return "emergency";
    if(ft.allergyAirway) return "urgent";
  }

  if(data.family==="fever" && (ft.confusion || ft.stiffNeckFever)) return "urgent";

  // Targeted red-flag combinations.
  if(data.family==="chest"){
    if(answer("chest_spread")==="yes") return "emergency";
    if(answer("chest_quality")==="yes" && answer("chest_assoc")==="yes") return "emergency";
    if(answer("chest_sudden")==="yes" && answer("chest_assoc")==="yes") return "urgent";
  }

  if(data.family==="breathing"){
    if(answer("breath_speak")==="no") return "emergency";
    if(answer("breath_colour")==="yes") return "emergency";
    if(answer("breath_confusion")==="yes") return "emergency";
    if(answer("breath_chest")==="yes") return "urgent";
  }

  if(data.family==="neuro"){
    if(answer("neuro_fast")==="yes") return "emergency";

    // Sudden neurological deficits are treated as emergency.
    if(answer("neuro_onset")==="yes" && (
      answer("neuro_vision")==="yes" ||
      answer("neuro_hearing")==="yes" ||
      includesAny(ctx,["weakness","numbness","blind","blindness","vision loss","loss of sight","deaf","deafness","hearing loss"])
    )) return "emergency";

    // Sudden vision loss is an emergency even without other features.
    if(answer("neuro_vision")==="yes") return "emergency";

    // Sudden hearing loss needs urgent assessment, but not automatically emergency
    // unless combined with other stroke-type features.
    if(answer("neuro_hearing")==="yes") return "urgent_stop";

    if(answer("neuro_fever")==="yes") return "urgent";
  }

  if(data.family==="fainting"){
    if(answer("faint_recovered")==="no") return "emergency";
    if(answer("faint_chest")==="yes" || answer("faint_neuro")==="yes") return "urgent";
    if(answer("faint_injury")==="yes") return "urgent";
  }

  if(data.family==="bleeding"){
    if(answer("bleed_stop")==="yes") return "emergency";
    if(answer("bleed_source")==="yes" && answer("bleed_faint")==="yes") return "emergency";
    if(answer("bleed_source")==="yes" || answer("bleed_faint")==="yes") return "urgent";
  }

  if(data.family==="abdominal"){
    if(answer("abd_sudden")==="yes" && answer("abd_faint")==="yes") return "emergency";
    if(answer("abd_preg")==="yes" && answer("abd_sudden")==="yes") return "urgent";
    if(answer("abd_preg")==="yes" && answer("abd_bleed")==="yes") return "urgent";
    if(answer("abd_sudden")==="yes") return "urgent";
  }

  if(data.family==="allergy"){
    if(answer("allergy_airway")==="yes" && answer("allergy_breath")==="yes") return "emergency";
    if(answer("allergy_breath")==="yes" || answer("allergy_dizzy")==="yes") return "emergency";
    if(answer("allergy_airway")==="yes") return "urgent";
  }

  if(data.family==="fever"){
    if(answer("fever_confusion")==="yes") return "urgent";
    if(answer("fever_breath")==="yes") return "urgent";
    if(answer("fever_neck")==="yes") return "urgent";
    if(data.patient==="child" && answer("fever_child")==="yes") return "urgent";
  }

  if(data.family==="seizure"){
    if(answer("seizure_time")==="yes") return "emergency";
    if(answer("seizure_repeat")==="yes") return "emergency";
    if(answer("seizure_recover")==="no") return "emergency";
    if(answer("seizure_first")==="yes") return "emergency";
  }

  if(data.family==="mental"){
    if(answer("mental_now")==="yes" || answer("mental_attempt")==="yes") return "emergency";
    if(answer("mental_now")==="unsure") return "urgent";
  }

  // If the additional symptom introduces a different high-risk family,
  // reassess that family too rather than staying locked to the original complaint.
  const secondaryFamily=detectFamily(data.other||"");
  if(secondaryFamily==="chest" && includesAny(data.other,["chest pain","chest pressure","chest tightness"])){
    if(ft.chestAssoc || ft.chestPressure) return "urgent";
  }
  if(secondaryFamily==="breathing" && includesAny(data.other,["difficulty breathing","shortness of breath","breathless","breathing problem"])){
    return "urgent";
  }
  if(secondaryFamily==="neuro" && (ft.neuroFast || ft.neuroSudden)){
    return "emergency";
  }
  if(secondaryFamily==="allergy" && (ft.allergyAirway || ft.allergyBreath)){
    return ft.allergyBreath ? "emergency" : "urgent";
  }

  // Generic conservative reassessment using the full picture.
  if(data.severity==="severe"){
    if(includesAny(ctx,["chest pain","difficulty breathing","shortness of breath","severe headache","abdominal pain","pelvic pain","bleeding","fainting","seizure","confusion"])) return "urgent";
  }

  if(data.patient==="child"){
    if(includesAny(ctx,["difficulty breathing","shortness of breath","very sleepy","hard to wake","not drinking","not feeding","floppy","limp","seizure"])) return "urgent";
  }

  return "education";
}

function detectIntent(text){
 const n=norm(text);

 // Explicit educational phrasing should go straight to Learn mode.
 if(LEARN_CUES.some(x=>n.includes(norm(x)))) return "learn";
 if(/^(what\s+(is|are)|wetin\s+be)\b/.test(n)) return "learn";

 // "Why..." questions often mean either:
 // 1) "I am experiencing this" OR
 // 2) "I just want to understand this".
 // Let the user choose rather than assuming symptom mode.
 if(/^(why|why\s+does|why\s+do|why\s+is|why\s+am|why\s+can't|why\s+cant|why\s+i)\b/.test(n)) return "ambiguous";

 // If the user clearly states they are experiencing something, use symptom flow.
 if(SYMPTOM_CUES.some(x=>n.includes(norm(x)))) return "symptom";
 if(detectDurationFromText(text) || detectPatientFromText(text)) return "symptom";

 // Other question forms can remain educational by default.
 if(/^(how|can|does|is)\b/.test(n)) return "learn";

 return "ambiguous";
}
function detectRoute(text){
 const n=norm(expandQuerySynonyms(text)); let best=ROUTES[ROUTES.length-1],bestScore=0;
 ROUTES.forEach(r=>{let sc=0;r.cues.forEach(c=>{const x=norm(c);if(n.includes(x))sc+=Math.max(2,x.split(" ").length*3)});if(sc>bestScore){best=r;bestScore=sc}});
 return best;
}

function canonicalMedicalTopic(text){
  const n=norm(text);

  if(/\b(enlarged prostate|prostate enlargement|big prostate|bph|benign prostatic hyperplasia)\b/.test(n)){
    return "prostate enlargement";
  }
  if(/\b(erection|erection problem|erection problems|erection difficulty|erection difficulties|weak erection|poor erection|impotence|erectile dysfunction)\b/.test(n)
     || /\b(can(?:not|'t|t) get an erection|can(?:not|'t|t) keep an erection|difficulty getting an erection|difficulty keeping an erection)\b/.test(n)){
    return "erectile dysfunction";
  }
  if(/\b(pcos|polycystic ovary syndrome)\b/.test(n)){
    return "pcos";
  }
  return "";
}

function isStrongEntityMatch(a,topic){
  const canonical=canonicalMedicalTopic(topic);
  if(!canonical) return false;

  const title=norm(a.title);
  const keys=norm(a.keywords);

  if(canonical==="prostate enlargement"){
    return title.includes("prostate enlargement") ||
           keys.includes("enlarged prostate") ||
           keys.includes("prostate enlargement") ||
           /\bbph\b/.test(title+" "+keys);
  }

  if(canonical==="erectile dysfunction"){
    return title.includes("erectile dysfunction") ||
           keys.includes("erectile dysfunction");
  }

  if(canonical==="pcos"){
    return /\bpcos\b/.test(title+" "+keys) ||
           title.includes("polycystic ovary syndrome") ||
           keys.includes("polycystic ovary syndrome");
  }

  return false;
}

function cleanLearnTopic(text){
 let n=String(text||"").trim();
 [/^what\s+(?:is|are)\s+/i,/^tell\s+me\s+about\s+/i,/^tell\s+me\s+more\s+about\s+/i,/^i\s+(?:want|would like)\s+to\s+learn\s+(?:more\s+)?about\s+/i,/^learn\s+(?:more\s+)?about\s+/i,/^explain\s+/i,/^information\s+about\s+/i,/^info\s+about\s+/i,/^wetin\s+be\s+/i].forEach(p=>n=n.replace(p,""));
 return n.replace(/[?.!]+$/,"").trim();
}
function routeScore(a,route){
 if(!route||route.id==="general")return 0;
 const cat=norm(a.category);let d=0;
 if(route.prefer.some(x=>cat.includes(norm(x))))d+=85;
 if(route.penalize.some(x=>cat.includes(norm(x))))d-=110;
 return d;
}

function parseIndex(text){
  return text.split(/(?=^ARTICLE\s+\d+\s*$)/gmi).map(block=>{
    const f={};
    block.split(/\r?\n/).forEach(line=>{
      const m=line.match(/^([A-Z][A-Z _/-]+):\s*(.*)$/);
      if(m) f[m[1].trim()]=m[2].trim();
    });
    if(!f.TITLE||!f.URL) return null;
    let article={
      title:f.TITLE,url:f.URL,language:f.LANGUAGE||"",category:f.CATEGORY||"",
      emergency:f["EMERGENCY FLAG"]||f.EMERGENCY||"",keywords:f.KEYWORDS||"",
      searchable:norm([f.TITLE,f.CATEGORY,f.KEYWORDS].join(" "))
    };

    // Temporary metadata correction: this HDG PCOS page is written in Pidgin,
    // although the current public index labels it as English.
    if(norm(article.url).includes("pcos-irregular-period-hormone-problem")){
      article.language="Pidgin";
      article.category="Women's Health";
      article.keywords=[article.keywords,"pcos","polycystic ovary syndrome","irregular period","hormone problem","pidgin"].join("; ");
      article.searchable=norm([article.title,article.category,article.keywords].join(" "));
    }

    return article;
  }).filter(Boolean);
}

async function loadArticles(){
  const status=document.getElementById("indexStatus");
  const candidates=["./HDG_Public_Article_Index.txt","./HDG_Public_Article_Index(1).txt"];
  for(const path of candidates){
    try{
      const r=await fetch(path,{cache:"no-store"});
      if(!r.ok) continue;
      const parsed=parseIndex(await r.text());
      if(parsed.length){
        ARTICLES=parsed;
        status.textContent="";
        console.log("HDG index loaded:",ARTICLES.length,"articles from",path);
        return;
      }
    }catch(e){console.warn("Index candidate failed:",path,e);}
  }
  status.textContent="HDG article index could not load.";
  console.error("HDG_INDEX_ERROR: no valid index file found");
}

function normalizeEverydaySymptoms(text){
  const raw=String(text||"");
  const n=norm(raw);
  const standards=[];

  EVERYDAY_SYMPTOM_MAP.forEach(item=>{
    if(item.phrases.some(p=>n.includes(norm(p)))) standards.push(item.standard);
  });

  // Keep the user's own wording AND append standardized concepts.
  // This preserves nuance while giving routing/safety/retrieval consistent terms.
  return standards.length ? raw+" "+[...new Set(standards)].join(" ") : raw;
}

const COMMON_TYPO_MAP={
  "anxeity":"anxiety","anxity":"anxiety","fibriod":"fibroid","fibriod":"fibroid",
  "hipertension":"hypertension","hypertention":"hypertension","maleria":"malaria",
  "diabetis":"diabetes","diabeties":"diabetes","ashtma":"asthma","astma":"asthma",
  "menapause":"menopause","endometrosis":"endometriosis","adenomysis":"adenomyosis",
  "prostste":"prostate"
};

function levenshtein(a,b){
  a=String(a||"");b=String(b||"");
  if(!a.length)return b.length;if(!b.length)return a.length;
  const prev=Array.from({length:b.length+1},(_,i)=>i),cur=new Array(b.length+1);
  for(let i=1;i<=a.length;i++){
    cur[0]=i;
    for(let j=1;j<=b.length;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+cost);
    }
    for(let j=0;j<=b.length;j++)prev[j]=cur[j];
  }
  return prev[b.length];
}

function articleVocabulary(){
  if(!ARTICLES.length)return [];
  const set=new Set();
  ARTICLES.forEach(a=>norm(a.title+" "+a.keywords).split(" ").forEach(w=>{
    if(w.length>=4&&!STOP_WORDS.has(w))set.add(w);
  }));
  return [...set];
}

function fuzzyExpandQuery(text){
  const raw=String(text||""),words=norm(raw).split(" ").filter(Boolean),adds=[],vocab=articleVocabulary();
  words.forEach(w=>{
    if(COMMON_TYPO_MAP[w]){adds.push(COMMON_TYPO_MAP[w]);return;}
    if(w.length<5||vocab.includes(w))return;
    const maxDist=w.length>=8?2:1;
    let best="",bestDist=99;
    for(const c of vocab){
      if(Math.abs(c.length-w.length)>maxDist||c[0]!==w[0])continue;
      const d=levenshtein(w,c);
      if(d<bestDist){bestDist=d;best=c;}
      if(bestDist===1)break;
    }
    if(best&&bestDist<=maxDist)adds.push(best);
  });
  return adds.length?raw+" "+[...new Set(adds)].join(" "):raw;
}

function expandQuerySynonyms(text){
  let out=normalizeEverydaySymptoms(fuzzyExpandQuery(text));
  QUERY_SYNONYMS.forEach(item=>{
    item.patterns.forEach(p=>{
      p.lastIndex=0;
      if(p.test(out)){
        p.lastIndex=0;
        out += " " + item.replace;
      }else{
        p.lastIndex=0;
      }
    });
  });
  return out;
}

function searchWords(s){
  const expanded=expandQuerySynonyms(s);
  return [...new Set(norm(expanded).split(" ").filter(w=>w.length>2&&!STOP_WORDS.has(w)))];
}

function scoreArticle(a,q){
  const expandedQuery=expandQuerySynonyms(q);
  const ws=searchWords(expandedQuery);
  const title=norm(a.title);
  const keys=norm(a.keywords);
  const cat=norm(a.category);
  const nq=norm(expandedQuery);

  let score=0;
  let lexicalMatches=0;

  ws.forEach(w=>{
    const titleHit = title===w || title.startsWith(w+" ") ||
      title.includes(" "+w+" ") || title.endsWith(" "+w) || title.includes(w);
    const keyHit = keys.includes(w);

    if(titleHit || keyHit) lexicalMatches++;

    if(title===w) score+=160;
    else if(title.startsWith(w+" ")) score+=70;
    else if(title.includes(" "+w+" ") || title.endsWith(" "+w)) score+=42;
    else if(title.includes(w)) score+=24;

    if(keyHit) score+=12;

    // Category can only refine an already relevant article; it cannot create relevance.
    if((titleHit || keyHit) && cat.includes(w)) score+=2;
  });

  // HARD GATE: no title/keyword match = never recommend this article.
  if(lexicalMatches===0) return -9999;

  if(title && nq.includes(title)) score+=180;

  const wc=title.split(" ").filter(Boolean).length;
  if(wc<=3) score+=50;
  else if(wc<=5) score+=18;

  score-=Math.max(0,wc-6)*2;

  // Comparison pages should not outrank direct symptom pages unless comparison is requested.
  if(/vs/.test(title) && !/vs/.test(nq)) score-=70;

  if(data.patient==="child"){
    if(cat.includes("children")||title.includes("child")||title.includes("children")||title.includes("pikin")||title.includes("baby")) score+=22;
  }else if(data.patient==="adult"){
    if(cat.includes("children")||title.includes("child")||title.includes("children")||title.includes("pikin")||title.includes("baby")) score-=40;
  }

  const route=ROUTES.find(r=>r.id===data.route)||ROUTES[ROUTES.length-1];
  score+=routeScore(a,route);
  const query=norm(expandedQuery);

  if(query.includes("knee")){
    if(title.includes("knee")||keys.includes("knee"))score+=180;
    if(cat.includes("musculoskeletal"))score+=70;
    if(title.includes("chest pain")||title.includes("pain with sex")||title.includes("breast pain"))score-=220;
  }
  if(query.includes("vaginal")&&query.includes("bleeding")){
    if(cat.includes("women's health"))score+=150;
    if(title.includes("vaginal")||keys.includes("vaginal")||title.includes("menstrual")||keys.includes("menstrual")||title.includes("period"))score+=100;
    if(cat.includes("blood")||title.includes("bleeding disorder"))score-=220;
  }
  if(query.includes("testicular")||query.includes("testicle")||query.includes("scrotal")||query.includes("scrotum")){
    if(cat.includes("men's health"))score+=140;
    if(cat.includes("women's health"))score-=180;
  }

  if(query.includes("high blood pressure")){
    if(title.includes("high blood pressure")) score+=320;
    if(cat.includes("heart")) score+=110;
    if(title.includes("blood pressure monitoring")) score+=60;
    if(title.includes("blood sugar")||title.includes("crp blood test")||title.includes("blood disorders")) score-=260;
  }

  if(query.includes("erectile dysfunction") || query.includes("erection")){
    if(title.includes("erectile dysfunction")) score+=900;
    if(keys.includes("erectile") && keys.includes("dysfunction")) score+=320;
    if(cat.includes("men's health")) score+=80;

    // Generic erection problems must not drift toward prostate disease merely
    // because the articles share a Men's Health category.
    if(title.includes("prostate cancer")) score-=1200;
    if(title.includes("prostate enlargement")) score-=850;
    if(/\bbph\b/.test(title+" "+keys)) score-=700;
    if(cat.includes("women's health")) score-=300;
  }

  if(query.includes("prostate enlargement") || query.includes("enlarged prostate") || /\bbph\b/.test(query)){
    if(title.includes("prostate enlargement")) score+=420;
    if(/\bbph\b/.test(title+" "+keys)) score+=180;
    if(cat.includes("men's health")) score+=120;
    if(title.includes("prostate cancer")) score-=320;
    if(cat.includes("general")) score-=80;
  }

  return score;
}


const ADULT_ONLY_TOPIC_MARKERS=[
  "erectile dysfunction","erection disorder","erection difficulty","impotence",
  "enlarged prostate","benign prostatic hyperplasia","bph","prostate enlargement",
  "menopause","perimenopause","postmenopausal","post-menopause"
];

function articleText(a){
  return norm([a.title,a.category,a.keywords].filter(Boolean).join(" "));
}
function isAdultOnlyArticle(a){
  const t=articleText(a);
  return ADULT_ONLY_TOPIC_MARKERS.some(x=>t.includes(norm(x)));
}
function isChildSpecificArticle(a){
  return /\b(child|children|pikin|baby|babies|infant|infants|toddler|toddlers|paediatric|pediatric)\b/.test(articleText(a));
}
function queryExplicitlyAdultOnly(q){
  const n=norm(normalizeEverydaySymptoms(q));
  return ADULT_ONLY_TOPIC_MARKERS.some(x=>n.includes(norm(x)));
}
function queryExplicitlyChild(q){
  return /\b(child|children|pikin|baby|babies|infant|infants|toddler|toddlers|teen|teenager)\b/.test(norm(q));
}
function ageAppropriateArticle(a,q){
  if(data.patient==="child" && isAdultOnlyArticle(a) && !queryExplicitlyAdultOnly(q)) return false;
  if(data.patient==="adult" && isChildSpecificArticle(a) && !queryExplicitlyChild(q)) return false;
  return true;
}
function questionIsAgeAppropriate(q){
  const t=norm([q.id,q.qE,q.qP].filter(Boolean).join(" "));
  if(data.patient==="child"){
    if(["erectile","erection","impotence","menopause","perimenopause","enlarged prostate","bph","prostate enlargement"]
      .some(x=>t.includes(norm(x)))) return false;
  }
  if(data.patient==="adult"){
    if(["wet diaper","wet nappy","floppy baby","baby not drinking","child not drinking","pikin no dey drink","breastfeeding"]
      .some(x=>t.includes(norm(x)))) return false;
  }
  return true;
}

function findArticles(q,limit=3){
  let pref=ARTICLES.filter(a=>norm(a.language)===norm(language));
  if(!pref.length) pref=ARTICLES;

  const ranked=pref
    .filter(a=>ageAppropriateArticle(a,q))
    .map(a=>({...a,score:scoreArticle(a,q)}))
    .filter(a=>a.score>0)
    .sort((a,b)=>b.score-a.score);

  const canonical=canonicalMedicalTopic(q);
  let ordered=ranked;

  if(canonical){
    // Exact disease/entity matches always lead ordinary symptom retrieval too.
    const strongSame=ranked.filter(a=>isStrongEntityMatch(a,q));

    if(strongSame.length){
      const strongUrls=new Set(strongSame.map(a=>a.url));
      ordered=[...strongSame,...ranked.filter(a=>!strongUrls.has(a.url))];
    }else{
      // If the selected language genuinely lacks the entity, prefer the correct
      // article in the other language over an unrelated article.
      const cross=ARTICLES
        .filter(a=>ageAppropriateArticle(a,q) && isStrongEntityMatch(a,q))
        .map(a=>({...a,score:scoreArticle(a,q)}))
        .sort((a,b)=>b.score-a.score);

      if(cross.length){
        const crossUrls=new Set(cross.map(a=>a.url));
        ordered=[...cross,...ranked.filter(a=>!crossUrls.has(a.url))];
      }
    }
  }

  const seen=new Set();
  return ordered.filter(a=>!seen.has(a.url)&&seen.add(a.url)).slice(0,limit);
}

const HDG_ANALYTICS_VERSION="v44";

function safeAnalyticsValue(v){
  if(v===undefined || v===null) return "";
  return String(v).slice(0,80);
}

function hdgTrack(eventName,params={}){
  const safe={
    assistant_version:HDG_ANALYTICS_VERSION,
    language:safeAnalyticsValue(language),
    ...Object.fromEntries(
      Object.entries(params)
        .filter(([k])=>[
          "intent","topic_family","patient_group","result_type","article_category",
          "article_position","source","focus","helpful","disposition","has_results"
        ].includes(k))
        .map(([k,v])=>[k,safeAnalyticsValue(v)])
    )
  };

  // Primary route when Ask HDG is embedded in Webador.
  try{
    if(window.parent && window.parent!==window){
      window.parent.postMessage({type:"HDG_ANALYTICS",event:eventName,params:safe},"*");
    }
  }catch(e){}

  // Optional fallback if a GA tag is ever added directly to the GitHub Pages app.
  try{
    if(typeof window.gtag==="function"){
      window.gtag("event",eventName,safe);
    }
  }catch(e){}

function starterSuggestions(){

function safetyReason(){
  const ctx=norm(normalizeEverydaySymptoms([data.main,data.other].filter(Boolean).join(" ")));
  const a=id=>answer(id)==="yes";

  if(hasVisionLossText() && suddenOnsetKnown())
    return language==="Pidgin"
      ?"Sudden loss of vision fit need quick medical assessment because some causes need treatment fast."
      :"Sudden loss of vision can need rapid medical assessment because some causes require time-sensitive treatment.";

  if(hasHearingLossText() && suddenOnsetKnown())
    return language==="Pidgin"
      ?"Sudden hearing loss fit need quick assessment because treatment fit work better when e start early."
      :"Sudden hearing loss can need prompt assessment because some treatments are time-sensitive.";

  if(a("neuro_fast") || includesAny(ctx,["face droop","slurred speech","one sided weakness","one-sided weakness"]))
    return language==="Pidgin"
      ?"New face droop, one-side weakness/numbness or speech problem fit be warning sign of serious brain problem such as stroke."
      :"New facial drooping, one-sided weakness/numbness or speech difficulty can be warning signs of a serious neurological problem such as stroke.";

  if(data.family==="chest" && (a("chest_spread") || a("chest_assoc") || includesAny(ctx,["chest pressure","chest tightness","sweating","shortness of breath"])))
    return language==="Pidgin"
      ?"Chest pain or pressure with these other symptoms fit sometimes happen with serious heart or circulation problems."
      :"Chest pain or pressure with these associated symptoms can sometimes occur with serious heart or circulation problems.";

  if(data.family==="breathing" && (a("breath_speak") || a("breath_blue") || includesAny(ctx,["gasping","cannot get words out","blue lips","grey lips"])))
    return language==="Pidgin"
      ?"Serious breathing difficulty fit mean say your body no dey get enough oxygen."
      :"Severe breathing difficulty can mean the body is not getting enough oxygen.";

  if(data.family==="allergy" && (a("allergy_airway") || a("allergy_breath")))
    return language==="Pidgin"
      ?"Swelling for mouth/throat together with breathing problem fit affect the airway quickly."
      :"Mouth or throat swelling with breathing difficulty can affect the airway quickly.";

  if(data.family==="bleeding" && (a("bleed_heavy") || includesAny(ctx,["uncontrolled bleeding","vomiting blood","black stool"])))
    return language==="Pidgin"
      ?"Heavy or uncontrolled bleeding fit cause serious blood loss and need quick medical assessment."
      :"Heavy or uncontrolled bleeding can cause significant blood loss and needs prompt medical assessment.";

  if(data.family==="seizure" || includesAny(ctx,["seizure","convulsion"]))
    return language==="Pidgin"
      ?"Some seizure situations need emergency assessment, especially if e long, repeat, or the person no recover well."
      :"Some seizure presentations need emergency assessment, especially when prolonged, repeated, or followed by poor recovery.";

  if(data.onsetPattern==="unsure")
    return language==="Pidgin"
      ?"Because you no sure about one warning sign, Ask HDG dey choose the safer option."
      :"Because you were unsure about a warning sign, Ask HDG is taking the safer option.";

  return language==="Pidgin"
    ?"The symptoms you describe include warning signs wey better make medical professional assess quickly."
    :"The symptoms you described include warning signs that are safer to have assessed promptly.";
}

function detectPatientFromText(text){
  const n=norm(text);

  const childCues=[
    "my child","my pikin","my baby","my son","my daughter",
    "this child","this pikin","this baby","for my child","for my pikin",
    "child has","pikin get","baby has","baby get",
    "year old child","year-old child","year old boy","year old girl",
    "years old child","years old boy","years old girl"
  ];
  if(childCues.some(x=>n.includes(norm(x)))) return "child";

  // Explicit adult wording only. We do not assume a bare symptom is adult.
  const adultCues=[
    "adult","for an adult","my husband","my wife","my partner",
    "adult man","adult woman","grown man","grown woman"
  ];
  if(adultCues.some(x=>n.includes(norm(x)))) return "adult";

  return "";
}


function detectOnsetPatternFromText(text){
  const n=norm(text);
  if(["sudden","suddenly","all of a sudden","abrupt","abruptly","out of nowhere"].some(x=>n.includes(norm(x)))) return "sudden";
  if(["gradual","gradually","slowly","over time","progressively","came on slowly"].some(x=>n.includes(norm(x)))) return "gradual";
  return "";
}

function detectDurationFromText(text){
  const raw=String(text||"").trim();
  const patterns=[
    /\bfor\s+(?:about\s+)?(\d+\s*(?:hour|hours|hr|hrs|day|days|week|weeks|month|months|year|years))\b/i,
    /\b(?:since|from)\s+(today|yesterday|last night|this morning|this afternoon|this evening)\b/i,
    /\b(?:started|start)\s+(today|yesterday|last night|this morning|this afternoon|this evening)\b/i,
    /\b(\d+\s*(?:hour|hours|hr|hrs|day|days|week|weeks|month|months|year|years))\s+(?:ago|now)\b/i,
    /\b(today|yesterday|last night|this morning|this afternoon|this evening)\b/i
  ];

  for(const p of patterns){
    const m=raw.match(p);
    if(m) return (m[1]||m[0]).trim();
  }
  return "";
}

  ].some(x=>n.includes(x));
}


function topicSpecificityScore(a,topic){
  const q=norm(cleanLearnTopic(topic));
  const title=norm(a.title);
  const keys=norm(a.keywords);

  let score=0;

  // Exact title = strongest possible general-topic match.
  if(title===q) score+=500;

  // Title starts with the topic, but penalize obvious narrower subtypes.
  if(title.startsWith(q+" ")) score+=120;

  const narrowerMarkers=[
    "social","in children","for children","for pikin","in adults","for adults",
    "vs","attack","management","severe","seasonal","exercise induced","night time"
  ];
  if(narrowerMarkers.some(x=>title.includes(x)) && title!==q) score-=180;

  // If the query is a single concept like "anxiety", prefer titles that are also concise.
  const qWords=q.split(" ").filter(Boolean);
  const titleWords=title.split(" ").filter(Boolean);
  if(qWords.length<=2){
    if(titleWords.length<=3) score+=70;
    else score-=Math.max(0,titleWords.length-4)*8;
  }

  // Exact keyword concept gets a small boost.
  if(keys.split(" ").includes(q)) score+=25;

  return score;
}

function findGeneralFallback(topic){
  const q=norm(cleanLearnTopic(topic));
  if(!q) return null;

  // Search all languages for a direct/general article.
  const candidates=ARTICLES.map(a=>({
    ...a,
    base:scoreArticle(a,topic),
    spec:topicSpecificityScore(a,topic)
  }))
  .filter(a=>a.base>0)
  .sort((a,b)=>(b.spec+b.base)-(a.spec+a.base));

  return candidates.find(a=>norm(a.title)===q) ||
         candidates.find(a=>topicSpecificityScore(a,topic)>=200) ||
         null;
}

function findLearnArticles(topic,limit=4){
  const wantsChild=learnQueryIsChildSpecific(topic);
  const previousPatient=data.patient;
  data.patient="";

  let pref=ARTICLES.filter(a=>norm(a.language)===norm(language));
  if(!pref.length) pref=ARTICLES;
  if(previousPatient) pref=pref.filter(a=>ageAppropriateArticle(a,topic));

  let matches=pref.map(a=>{
    let total=scoreArticle(a,topic);
    const text=norm(a.title+" "+a.category);
    const isChild=/\b(child|children|pikin|baby|babies|infant|toddler|teen)\b/.test(text);

    total += topicSpecificityScore(a,topic);

    if(wantsChild){
      total += isChild ? 70 : 0;
    }else{
      total += isChild ? -90 : 25;
    }

    return {...a,score:total};
  })
  .filter(a=>a.score>0)
  .sort((a,b)=>b.score-a.score);

  data.patient=previousPatient;

  // Strong disease/entity queries should never return an unrelated article merely
  // to preserve the selected language. If no close match exists in that language,
  // put the correct article from the other language first.
  const canonical=canonicalMedicalTopic(topic);
  if(canonical && !wantsChild){
    const sameLanguageEntity=matches.find(a=>isStrongEntityMatch(a,topic));

    if(!sameLanguageEntity){
      const crossLanguageEntity=ARTICLES
        .filter(a=>isStrongEntityMatch(a,topic))
        .map(a=>({...a,score:scoreArticle(a,expandQuerySynonyms(topic))+topicSpecificityScore(a,topic)}))
        .sort((a,b)=>b.score-a.score)[0];

      if(crossLanguageEntity){
        matches=matches.filter(a=>a.url!==crossLanguageEntity.url);
        matches.unshift({...crossLanguageEntity,score:99999});
      }
    }else{
      matches=matches.sort((a,b)=>{
        if(a.url===sameLanguageEntity.url) return -1;
        if(b.url===sameLanguageEntity.url) return 1;
        return b.score-a.score;
      });
    }
  }

  // For a general learning query, do not lead with a narrower subtype just because
  // the preferred language lacks a direct general article.
  if(!wantsChild && !canonical){
    const generalFallback=findGeneralFallback(topic);
    if(generalFallback){
      const already=matches.some(a=>a.url===generalFallback.url);
      if(!already){
        matches.unshift({...generalFallback,score:9999});
      }else{
        matches=matches.sort((a,b)=>{
          if(a.url===generalFallback.url) return -1;
          if(b.url===generalFallback.url) return 1;
          return b.score-a.score;
        });
      }
    }
  }

  const seen=new Set();
  return matches.filter(a=>!seen.has(a.url)&&seen.add(a.url)).slice(0,limit);
}

function continueAfterDurationSelective(){
  if(familyNeedsGeneralOnsetQuestion() && !data.onsetPattern){
    step="onset_pattern";
    askChoices(C().qOnsetPattern,[
      {t:C().sudden,v:"sudden"},
      {t:C().gradual,v:"gradual"},
      {t:C().unsure,v:"unsure"}
    ]);
    return;
  }

  if(normalFlowNeuroStop()) return;

  if(!data.patient){
    step="patient";
    askChoices(C().qPatient,[{t:C().adult,v:"adult"},{t:C().child,v:"child"}]);
    return;
  }

  startTargeted();

function beginSymptomFlow(){
 if(mentalHealthCrisisDetected(data.main)){hardStopMentalHealthCrisis();return;}
 if(severeMentalHealthDetected(data.main)){hardStopSevereMentalHealth();return;}
 if(lumpOrBirthmarkUrgentDetected(data.main)){hardStopLumpOrBirthmark();return;}
 if(immediateDanger(data.main)){hardStopEmergency();return;}
 if(traumaDetected(data.main)){hardStopTrauma();return;}

 // Adult-only life-stage topics should never trigger an "adult or child?" question.
 if(queryExplicitlyAdultOnly(data.main)){
   data.patient="adult";
 }

 data.family=detectFamily(data.main);
 if(data.family!=="general")potentialWarning();

 // If the user already stated sudden vision/hearing loss or stroke-type weakness,
 // act before the ordinary questionnaire continues.
 if(normalFlowNeuroStop()) return;

 // If onset/duration was already typed, do not ask it again.
 if(!data.duration){
   step="duration";
   setQuestion(C().qDuration,C().phDuration);
   return;
 }

 // Add onset only for families that did not already have it in
 // their targeted emergency questions.
 continueAfterDurationSelective();
}

function submitText(){
  const v=input.value.trim();
  if(!v){showCard(C().empty);return;}
  logTranscript("user",v,"text_answer");

  // Save the current screen before EVERY submission, including the first one.
  // This lets users return from "When did this start?" to the original question.
  captureAnswerState();

  if(step==="main"){
    data.main=v;
    captureInitialContext(v);
    data.intent=detectIntent(v);
    data.topic=cleanLearnTopic(v);
    data.route=detectRoute(v).id;
    hdgTrack("ask_hdg_started",{
      intent:data.intent||"unknown",
      topic_family:analyticsTopicFamily(),
      patient_group:analyticsPatientGroup(),
      source:"typed_or_prefilled"
    });
    updateTranscriptSession({
      language,
      intent:data.intent||"unknown",
      topic_family:analyticsTopicFamily(),
      patient_group:analyticsPatientGroup()
    });

    if(data.intent==="learn"){learnMode();return;}
    if(data.intent==="ambiguous"){askIntent();return;}

    beginSymptomFlow();
    return;
  }

  if(step==="duration"){
    data.duration=v;
    const p=detectOnsetPatternFromText(v);
    if(p) data.onsetPattern=p;
    continueAfterDurationSelective();
    return;
  }

  if(step==="other"){
    data.other=/^(no|none|nope|nothing)$/i.test(v)?"":v;
    const mentalContext=[data.main,data.other].filter(Boolean).join(" ");
    if(mentalHealthCrisisDetected(mentalContext)){hardStopMentalHealthCrisis();return;}
    if(severeMentalHealthDetected(mentalContext)){hardStopSevereMentalHealth();return;}
    if(lumpOrBirthmarkUrgentDetected(mentalContext)){hardStopLumpOrBirthmark();return;}
    if(immediateDanger(data.other)){hardStopEmergency();return;}
    if(traumaDetected(data.other)){hardStopTrauma();return;}
    if(normalFlowNeuroStop()) return;
    review();
  }
}
function choose(v){
  if(!["helpful","retry"].includes(step))captureAnswerState();

  if(step==="onset_pattern"){
    if(v==="unsure")data.uncertainSafety=true;
    data.onsetPattern=v;

    if(!data.patient){
      step="patient";
      askChoices(C().qPatient,[{t:C().adult,v:"adult"},{t:C().child,v:"child"}]);
      return;
    }

    startTargeted();
    return;
  }

  if(step==="patient"){
    data.patient=v;
    startTargeted();
    return;
  }

  if(step==="targeted"){
    const q=targetedQueue.shift();

    // Safety rule: "Not sure" is treated the same as "Yes".
    // We would rather escalate uncertainty than falsely reassure.
    if(v==="unsure")data.uncertainSafety=true;
    const safetyValue = v==="unsure" ? "yes" : v;
    data.targeted[q.id]=safetyValue;

    if(normalFlowNeuroStop()) return;

    const disposition=safetyDisposition();
    if(disposition==="emergency"){hardStopEmergency();return;}
    if(disposition==="urgent_stop"){
      hardStopUrgent(
        language==="Pidgin"?"Sudden hearing loss need urgent medical assessment.":"Sudden hearing loss needs urgent medical assessment.",
        language==="Pidgin"
          ?"Abeg seek urgent in-person medical care now. Sudden hearing loss fit need treatment quickly. Ask HDG no go recommend articles first for this presentation."
          :"Please seek urgent in-person medical care now. Sudden hearing loss can need time-sensitive assessment and treatment. Ask HDG will not recommend articles first for this presentation."
      );
      return;
    }

    askNextTargeted();
    return;
  }

  if(step==="severity"){
    data.severity=v;
    step="other";setQuestion(C().qOther,C().phOther);return;
  }

  if(step==="confirm"){
    if(v==="yes") finalOutcome();
    else reset();
    return;
  }

  if(step==="helpful"){
    hdgTrack("ask_hdg_helpful_response",{
      intent:data.intent||"symptom",topic_family:analyticsTopicFamily(),
      patient_group:analyticsPatientGroup(),helpful:v
    });
    updateTranscriptSession({helpful:v});
    if(v==="yes"){
      inputArea.classList.add("hidden");
      step="done";
      showCard(C().thanks);
      hideBackOnFinalScreen();
      renderStarterSuggestions();
    }else{
      step="retry";
      askChoices(C().notHelpful+" "+C().retry,[{t:C().yes,v:"yes"},{t:C().no,v:"no"}]);
      renderStarterSuggestions();
    }
    return;
  }

  if(step==="retry"){
    hdgTrack("ask_hdg_retry_selected",{
      intent:data.intent||"unknown",topic_family:analyticsTopicFamily(),
      patient_group:analyticsPatientGroup(),source:v==="yes"?"retry_yes":"retry_no"
    });
    if(v==="yes") reset();
    else{
      inputArea.classList.add("hidden");
      step="done";
      showCard(C().thanks);
      hideBackOnFinalScreen();
      renderStarterSuggestions();
    }
  }
}

function articleBlock(limit=3){
  if(!ARTICLES.length) return `<p>${esc(C().noMatch)}</p>`;

  const mainQuery=data.main || "";
  const otherQuery=data.other || "";

  const preferred=findArticles(mainQuery,Math.max(limit,4));

  const combinedQuery=[mainQuery,otherQuery].filter(Boolean).join(" ");
  const combined=findArticles(combinedQuery,Math.max(limit,6));

  const otherOnly=otherQuery ? findArticles(otherQuery,Math.max(limit,4)) : [];

  const seen=new Set();
  const ordered=[];

  function add(list){
    list.forEach(a=>{
      if(!seen.has(a.url)){
        seen.add(a.url);
        ordered.push(a);
      }
    });
  }

  // Main symptom must stay dominant.
  add(preferred.slice(0,2));

  // Then allow one article informed by the whole symptom picture.
  add(combined);

  // Only use an additional-symptom article if room remains.
  add(otherOnly);

  const m=ordered.slice(0,limit);

  if(!m.length) return `<p>${esc(C().noMatch)}</p>`;

  return m.map(a=>`<div class="article"><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a>${a.category?`<br><span class="muted">${esc(a.category)}</span>`:""}</div>`).join("");
}

      <div class="choices"><button class="choice" data-v="yes">${esc(C().yes)}</button><button class="choice" data-v="no">${esc(C().no)}</button></div>
    `);
  }

  wireChoiceButtons();
  wireTrackedArticleLinks(chat);
}

document.getElementById("englishBtn").onclick=()=>setLanguage("English");
document.getElementById("pidginBtn").onclick=()=>setLanguage("Pidgin");
ask.onclick=submitText;
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submitText();}});

reset();
loadArticles();
</script>


</body>
</html>
